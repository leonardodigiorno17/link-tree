<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credits - Leonardo Di Giorno</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      color:white;
      text-align:center;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(180deg,#7b0000,#b30000,#ff1a1a);
    }

    .box{
      max-width:450px;
      padding:30px;
      border-radius:25px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(12px);
      box-shadow:0 0 30px rgba(255,255,255,0.25);
    }

    a{
      display:inline-block;
      margin-top:20px;
      padding:12px 18px;
      border-radius:15px;
      background:white;
      color:#b30000;
      text-decoration:none;
      font-weight:bold;
      transition:.3s;
    }

    a:hover{
      transform:scale(1.05);
      box-shadow:0 0 20px white;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Credits</h1>

    <p>
      Questo sito personale è stato realizzato da 
      <strong>Leonardo Di Giorno</strong>.
    </p>

    <p>
      Progetto scolastico: Linktree personale trasformato in una piccola web app.
    </p>

    <p>
      Sono stati utilizzati HTML, CSS, JavaScript, jQuery, tabelle, form e link relativi.
    </p>

    <a href="index.html">Torna alla Home</a>
  </div>

</body>
</html>
